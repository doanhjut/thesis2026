name: Daily VirusTotal Cuckoofork collection

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/vt-cuckoofork-daily-collection.yml
  schedule:
    - cron: "30 0 * * *"

permissions:
  contents: write

concurrency:
  group: vt-cuckoofork-daily-collection
  cancel-in-progress: false

jobs:
  collect-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Check out experiment branch
        uses: actions/checkout@v4
        with:
          ref: feat/reproducible-thesis-experiments

      - name: Collect resumable daily batch
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: |
          output=/tmp/vt-cuckoofork-batch-${{ github.run_id }}
          python scripts/collect_vt_cuckoofork_batch.py \
            --cohort results/measured_20261023_malbehavd_pid_confirmatory_1922/selected_cohort.csv \
            --state results/measured_20261028_vt_cuckoofork_full/collection_state.csv \
            --output "$output" \
            --run-id "${{ github.run_id }}" \
            --requests-per-minute 4 \
            --max-api-requests 350

      - name: Commit collection state and batch audit
        run: |
          output=/tmp/vt-cuckoofork-batch-${{ github.run_id }}
          target=results/measured_20261028_vt_cuckoofork_full
          mkdir -p "$target/batches"
          cp "$output/batch_summary.json" "$target/batches/${{ github.run_id }}_summary.json"
          cp "$output/request_history.csv" "$target/batches/${{ github.run_id }}_request_history.csv"
          (cd "$target" && find . -type f ! -name artifact_sha256.txt -print0 | sort -z | xargs -0 sha256sum > artifact_sha256.txt)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$target"
          if git diff --cached --quiet; then
            echo "No collection state change"
          else
            git commit -m "Update daily Cuckoofork collection state"
            git push origin HEAD:feat/reproducible-thesis-experiments
          fi

      - name: Upload immutable batch artifact
        uses: actions/upload-artifact@v4
        with:
          name: vt-cuckoofork-batch-${{ github.run_id }}
          path: /tmp/vt-cuckoofork-batch-${{ github.run_id }}/
          if-no-files-found: error
          retention-days: 30
